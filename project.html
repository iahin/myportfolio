<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <main id="project-app" aria-live="polite">
    <section class="loading-state">
      <p>Loading...</p>
    </section>
  </main>

  <template id="project-template">
    <div class="page-shell">
      <main class="project-main">
        <div class="project-back-row">
          <a class="button-secondary project-back-link" data-field="projectBackLink" href="./index.html#projects"></a>
        </div>
        <section class="case-hero compact-case-hero">
          <div class="case-hero-grid compact-case-grid">
            <div class="case-copy">
              <h1 class="case-title" data-field="detailTitle"></h1>
              <p class="case-subtitle" data-field="detailSubtitle"></p>
              <div class="case-hashtags" data-field="detailHashtags"></div>
            </div>

            <div class="case-hero-visual">
              <div class="hero-image-frame">
                <img data-field="detailHeroImage" alt="">
              </div>
            </div>
          </div>
        </section>

        <section class="detail-section compact-section">
          <div class="section-header section-header-compact">
            <div>
              <h2 class="section-title" data-field="overviewTitle"></h2>
              <p class="section-summary" data-field="overviewSummary"></p>
            </div>
          </div>
          <div class="overview-grid">
            <article class="challenge-card challenge-card-light">
              <h3 data-field="problemTitle"></h3>
              <p data-field="problemText"></p>
            </article>

            <article class="challenge-card challenge-card-blue">
              <h3 data-field="solutionTitle"></h3>
              <p data-field="solutionText"></p>
            </article>
          </div>
        </section>

        <section class="detail-section compact-section">
          <div class="section-header section-header-compact">
            <div>
              <h2 class="section-title" data-field="architectureTitle"></h2>
            </div>
          </div>
          <article class="architecture-card">
            <p data-field="architectureIntro"></p>
            <div class="code-block compact-code-block">
              <pre><code data-field="architectureCode"></code></pre>
            </div>
            <p data-field="architectureOutro"></p>
          </article>
        </section>

        <section class="detail-section compact-section">
          <div class="section-header section-header-compact">
            <div>
              <h2 class="section-title" data-field="stacksTitle"></h2>
              <p class="section-summary" data-field="stacksSummary"></p>
            </div>
          </div>
          <div class="detail-stack-badges" data-field="stackBadges"></div>
        </section>

        <section class="detail-section compact-section">
          <div class="section-header section-header-compact">
            <div>
              <h2 class="section-title" data-field="impactTitle"></h2>
              <p class="section-summary" data-field="impactSummary"></p>
            </div>
          </div>
          <div class="impact-metrics" data-field="impactMetrics"></div>
          <div class="impact-list" data-field="impactItems"></div>
        </section>

        <section class="detail-section compact-section">
          <div class="section-header section-header-compact">
            <div>
              <h2 class="section-title" data-field="galleryTitle"></h2>
              <p class="section-summary" data-field="gallerySummary"></p>
            </div>
          </div>
          <div class="gallery-grid" data-field="galleryItems"></div>
        </section>
      </main>
      <div class="gallery-lightbox" data-field="galleryLightbox" hidden>
        <button class="gallery-lightbox-close" type="button" data-field="galleryLightboxClose" aria-label="Close image">Close</button>
        <div class="gallery-lightbox-card">
          <img data-field="galleryLightboxImage" alt="">
          <div class="gallery-lightbox-copy">
            <h3 data-field="galleryLightboxTitle"></h3>
            <p data-field="galleryLightboxDescription"></p>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="./scripts/pages/project.js?v=2"></script>
</body>
</html>
