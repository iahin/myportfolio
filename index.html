<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="home-page">
  <main id="app" aria-live="polite">
    <section class="loading-state">
      <p>Loading...</p>
    </section>
  </main>

  <template id="portfolio-template">
    <div class="page-shell">
      <nav class="top-nav">
        <div class="top-nav-inner">
          <div class="nav-links" data-field="navLinks"></div>
        </div>
      </nav>

      <div class="hero-backdrop micro-grid" aria-hidden="true"></div>
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>

      <section id="top" class="hero-section">
        <div class="hero-grid">
          <div class="hero-copy">
            <h1 class="hero-title">
              <span data-field="heroTitlePrefix"></span>
              <span class="hero-title-strong" data-field="heroTitleStrong"></span>
            </h1>

            <div class="hero-body">
              <p class="hero-summary" data-field="heroSummary"></p>

              <div class="hero-stats" data-field="heroStats"></div>
            </div>
          </div>

          <div class="hero-visual">
            <div class="hero-image-frame">
              <img class="hero-image" data-field="heroImage" alt="">
              <div class="hero-image-wash" aria-hidden="true"></div>
              <div class="status-card">
                <div class="status-head">
                  <span data-field="heroStatusLabel"></span>
                  <span class="status-dot"></span>
                </div>
                <div class="status-bar">
                  <span class="status-fill"></span>
                </div>
              </div>
              <div class="quote-card">
                <span class="quote-label" data-field="heroQuoteLabel"></span>
                <p data-field="heroQuote"></p>
              </div>
              <svg class="schematic" viewBox="0 0 400 500" aria-hidden="true">
                <line x1="50" y1="0" x2="50" y2="500"></line>
                <circle cx="50" cy="120" r="3"></circle>
                <line x1="0" y1="400" x2="400" y2="400"></line>
                <circle cx="320" cy="400" r="3"></circle>
              </svg>
            </div>
            <div class="badge" data-field="heroBadge"></div>
          </div>
        </div>
      </section>

      <section id="projects" class="projects-section">
        <header class="projects-header">
          <div class="projects-header-copy">
            <h2 class="projects-title">
              <span data-field="projectsTitle"></span>
              <span class="projects-title-muted" data-field="projectsTitleMuted"></span>
            </h2>
            <p class="projects-summary" data-field="projectsSummary"></p>
          </div>
        </header>

        <div class="projects-grid" data-field="projectsGrid"></div>
      </section>

      <section id="experience" class="timeline-page-section">
        <header class="timeline-hero">
          <div class="timeline-hero-grid">
            <div class="timeline-hero-copy">
              <h2 class="timeline-title">
                <span data-field="experienceTitle"></span>
                <span class="timeline-title-muted" data-field="experienceTitleMuted"></span>
              </h2>
            </div>
            <div class="timeline-summary-shell">
              <p class="timeline-summary" data-field="experienceSummary"></p>
            </div>
          </div>
        </header>
        <div class="timeline-section">
          <div class="timeline-line" aria-hidden="true"></div>
          <div class="timeline-list" data-field="timelineEntries"></div>
        </div>
      </section>

      <section id="contact" class="timeline-cta">
        <div class="timeline-cta-panel">
          <div class="timeline-cta-copy">
            <h3 data-field="experienceCtaTitle"></h3>
            <p data-field="experienceCtaSummary"></p>
          </div>
          <div class="timeline-contact-links" data-field="experienceContactChannels"></div>
        </div>
      </section>
    </div>
  </template>

  <script type="module" src="./scripts/home/index.js"></script>
</body>
</html>
