<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal portfolio website">
  <title>Portfolio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./index.html">Portfolio</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="app" class="content" aria-live="polite">
      <section class="loading-state">
        <p>Loading portfolio content...</p>
      </section>
    </main>
  </div>

  <template id="portfolio-template">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" data-field="eyebrow"></p>
        <h1 data-field="name"></h1>
        <p class="hero-tagline" data-field="tagline"></p>
        <p class="hero-summary" data-field="summary"></p>
        <div class="hero-actions">
          <a class="button button-primary" data-field="primaryLink">View Projects</a>
          <a class="button button-secondary" data-field="secondaryLink">Contact</a>
        </div>
      </div>

      <aside class="hero-card">
        <img class="profile-image" data-field="image" alt="">
        <div class="hero-card-text">
          <p class="card-label">Current focus</p>
          <p class="card-value" data-field="focus"></p>
        </div>
      </aside>
    </section>

    <section id="about" class="section">
      <div class="section-heading">
        <p class="eyebrow">About</p>
        <h2>Simple, local-data portfolio</h2>
      </div>
      <div class="about-grid" data-field="highlights"></div>
    </section>

    <section id="projects" class="section">
      <div class="section-heading">
        <p class="eyebrow">Projects</p>
        <h2>Featured work</h2>
      </div>
      <div class="project-grid" data-field="projects"></div>
    </section>

    <section id="contact" class="section contact-panel">
      <div>
        <p class="eyebrow">Contact</p>
        <h2>Let&apos;s build something useful.</h2>
      </div>
      <a class="button button-primary" data-field="emailLink">Send Email</a>
    </section>
  </template>

  <script src="./script.js" defer></script>
</body>
</html>
