<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Experience timeline">
  <title>Experience Timeline</title>
  <link rel="stylesheet" href="./experience-styles.css">
</head>
<body>
  <main id="experience-app" aria-live="polite">
    <section class="loading-state">
      <p>Loading experience timeline...</p>
    </section>
  </main>

  <template id="experience-template">
    <div class="page-shell">
      <nav class="top-nav">
        <div class="top-nav-inner">
          <a class="brand" data-field="brandName" href="./index.html">Ledger.Dev</a>
          <div class="nav-links" data-field="navLinks"></div>
          <div class="nav-meta">
            <span class="terminal-pill">TERMINAL</span>
            <div class="avatar-shell">
              <img data-field="avatarImage" alt="">
            </div>
          </div>
        </div>
      </nav>

      <main class="experience-main">
        <header class="timeline-hero">
          <div class="timeline-hero-grid">
            <div class="timeline-hero-copy">
              <p class="section-kicker" data-field="experienceKicker"></p>
              <h1 class="timeline-title">
                <span data-field="experienceTitle"></span>
                <span class="timeline-title-muted" data-field="experienceTitleMuted"></span>
              </h1>
            </div>
            <div class="timeline-summary-shell">
              <p class="timeline-summary" data-field="experienceSummary"></p>
            </div>
          </div>
        </header>

        <section class="timeline-section">
          <div class="timeline-line" aria-hidden="true"></div>
          <div class="timeline-list" data-field="timelineEntries"></div>
        </section>

        <section class="timeline-cta">
          <div class="timeline-cta-panel">
            <div class="timeline-cta-copy">
              <h2 data-field="ctaTitle"></h2>
              <p data-field="ctaSummary"></p>
            </div>
            <div class="timeline-cta-actions">
              <a class="cta-button cta-button-primary" data-field="ctaPrimary"></a>
              <a class="cta-button cta-button-secondary" data-field="ctaSecondary"></a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div class="footer-branding">
            <span class="footer-brand" data-field="brandNameFooter"></span>
            <p class="footer-copy" data-field="footerText"></p>
          </div>
          <div class="footer-links" data-field="footerLinks"></div>
        </div>
      </footer>
    </div>
  </template>

  <script src="./experience-script.js" defer></script>
</body>
</html>
