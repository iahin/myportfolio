<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact page">
  <title>Contact</title>
  <link rel="stylesheet" href="./contact-styles.css">
</head>
<body>
  <main id="contact-app" aria-live="polite">
    <section class="loading-state">
      <p>Loading contact page...</p>
    </section>
  </main>

  <template id="contact-template">
    <div class="page-shell">
      <nav class="top-nav">
        <div class="top-nav-inner">
          <a class="brand" data-field="brandName" href="./index.html">Ledger.Dev</a>
          <div class="nav-links" data-field="navLinks"></div>
          <div class="nav-meta">
            <button class="terminal-button" type="button">TERMINAL</button>
            <div class="avatar-shell">
              <img data-field="avatarImage" alt="">
            </div>
          </div>
        </div>
      </nav>

      <main class="contact-main">
        <header class="contact-hero">
          <div class="availability-pill">
            <span class="availability-dot"></span>
            <span data-field="availabilityText"></span>
          </div>
          <h1 class="contact-title">
            <span data-field="contactTitlePrefix"></span>
            <span class="contact-title-accent" data-field="contactTitleAccent"></span>
            <span data-field="contactTitleSuffix"></span>
          </h1>
          <p class="contact-summary" data-field="contactSummary"></p>
        </header>

        <section class="contact-layout">
          <section class="contact-form-card">
            <form class="contact-form" action="#" method="post">
              <div class="form-grid">
                <div class="field">
                  <label for="name">Full Name</label>
                  <input id="name" name="name" type="text" placeholder="Elias Thorne">
                </div>
                <div class="field">
                  <label for="email">Email Address</label>
                  <input id="email" name="email" type="email" placeholder="elias@example.com">
                </div>
              </div>
              <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Describe your project or technical challenge..."></textarea>
              </div>
              <button class="submit-button" type="submit">
                <span>Send Transmission</span>
                <span class="submit-arrow">-></span>
              </button>
            </form>
          </section>

          <aside class="contact-sidebar">
            <section class="channel-section">
              <h2>Contact Channels</h2>
              <div class="channel-list" data-field="contactChannels"></div>
            </section>

            <div class="ghost-divider" aria-hidden="true"></div>

            <section class="response-card">
              <h3>Response Latency</h3>
              <div class="response-time">
                <strong data-field="responseWindow"></strong>
                <span data-field="responseUnit"></span>
              </div>
              <p data-field="responseText"></p>
            </section>

            <section class="map-card">
              <img data-field="mapImage" alt="">
            </section>
          </aside>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <span class="footer-brand" data-field="brandNameFooter"></span>
          <p class="footer-copy" data-field="footerText"></p>
          <div class="footer-links" data-field="footerLinks"></div>
        </div>
      </footer>
    </div>
  </template>

  <script src="./contact-script.js" defer></script>
</body>
</html>
